<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<title>Учёт алкоголя</title>
<style>
  :root { --bg: #0f1117; --card: #1a1d27; --border: #2a2f3d; --text: #f1f5f9; --muted: #94a3b8; --emerald: #10b981; --red: #ef4444; --amber: #f59e0b; --blue: #3b82f6; --radius: 16px; --shadow: 0 4px 20px rgba(0,0,0,.35); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 78px; min-height: 100vh; }
  input, select, button { font-size: 16px; font-family: inherit; }
  #authScreen { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at 20% 10%, rgba(16,185,129,.12), transparent 45%), radial-gradient(circle at 80% 90%, rgba(59,130,246,.10), transparent 45%), var(--bg); }
  .auth-wrap { width: 100%; max-width: 360px; }
  .auth-logo { text-align:center; font-size: 46px; margin-bottom: 6px; }
  .auth-title { text-align:center; font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .auth-sub { text-align:center; color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); }
  .field-label { display:block; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
  .input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--border); background: #12151e; color: var(--text); outline: none; }
  .input:focus { border-color: var(--emerald); }
  button { flex: 1; padding: 13px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--emerald); color: #04140d; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-ghost { background: #262b38; color: var(--text); }
  .btn-full { width: 100%; }
  .mt-10 { margin-top: 10px; }
  .hint { font-size: 12px; color: #6b7280; padding: 8px 0 0; text-align: center; }
  .hint a { color: var(--emerald); text-decoration: none; }
  .err { color: #f87171; font-size: 13px; margin-top: 8px; text-align: center; }
  header { position: sticky; top: 0; z-index: 10; background: var(--card); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .badge { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 20px; background: #262b38; }
  .badge.admin { background: var(--emerald); color: #04140d; }
  .container { padding: 14px; }
  .search { width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--text); margin-bottom: 14px; outline: none; }
  .room-card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
  .room-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .room-title { font-weight: 700; font-size: 16px; }
  .stock-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: rgba(16,185,129,.15); color: var(--emerald); }
  .stock-badge.zero { background: rgba(239,68,68,.15); color: var(--red); }
  .item-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .item-controls { display: flex; align-items: center; gap: 8px; }
  .qty-pill { min-width: 28px; text-align: center; background: #12151e; border-radius: 8px; padding: 4px 8px; font-weight: 700; font-size: 13px; }
  .btn-minus { flex: none; width: 34px; height: 34px; padding: 0; border-radius: 10px; background: rgba(239,68,68,.15); color: var(--red); font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters button { flex: 1; padding: 9px; font-size: 13px; font-weight: 600; background: var(--card); color: var(--muted); border: 1px solid var(--border); border-radius: 10px; }
  .filters button.active { background: var(--emerald); color: #04140d; border-color: var(--emerald); }
  .note { font-size: 13.5px; padding: 12px 14px; background: var(--card); margin-bottom: 9px; border-radius: 12px; border-left: 3px solid var(--red); }
  .note.arrival { border-left-color: var(--blue); }
  .note .time { color: #6b7280; font-size: 11.5px; margin-top: 5px; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; background: var(--card); border-top: 1px solid var(--border); }
  .tab { flex: 1; padding: 10px 2px 8px; text-align: center; font-size: 10.5px; color: #6b7280; cursor: pointer; }
  .tab.active { color: var(--emerald); }
  .tab .icon { font-size: 20px; display: block; margin-bottom: 3px; }
  .modal-bg { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.72); align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--card); border-radius: 18px; padding: 20px; width: 100%; max-width: 400px; }
  .modal h3 { margin: 0 0 14px; font-size: 17px; }
  .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
  .view { display: none; }
  .view.active { display: block; }
  .block-title { font-size: 14px; color: var(--emerald); margin: 20px 0 10px 4px; font-weight: 700; text-transform: uppercase; }
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-wrap">
    <div class="auth-logo">🍾</div>
    <h1 class="auth-title">Учёт алкоголя</h1>
    <p class="auth-sub">Команда 5 человек · #1 — админ</p>
    <div id="authForm">
      <div style="text-align:center; color:var(--muted);" id="loadText">Подключение...</div>
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <h1>🍾 Учёт алкоголя</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="roleBadge" class="badge">—</span>
      <button style="flex:none;padding:7px 11px;font-size:12px;" class="btn-ghost" onclick="logout()">Выйти</button>
    </div>
  </header>

  <div id="view-rooms" class="view active">
    <div class="container">
      <input class="search" id="searchRooms" placeholder="🔍 Поиск..." oninput="renderRooms()">
      <div id="roomsList"></div>
    </div>
  </div>

  <div id="view-notes" class="view">
    <div class="container">
      <div class="filters">
        <button class="active" onclick="setFilter('all', this)">Все</button>
        <button onclick="setFilter('arrival', this)">Приход</button>
        <button onclick="setFilter('writeoff', this)">Списание</button>
      </div>
      <div id="notesList"></div>
    </div>
  </div>

  <div id="view-admin" class="view">
    <div class="container" id="adminPanel"></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('rooms', this)"><span class="icon">🏨</span>Номера</div>
    <div class="tab" onclick="switchTab('notes', this)"><span class="icon">📝</span>История</div>
    <div class="tab" onclick="switchTab('admin', this)"><span class="icon">⚙️</span>Админ</div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalContent"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://slffatuydefaeyubzbdy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsZmZhdHV5ZGVmYWV5dWJ6YmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNjk0MTcsImV4cCI6MjEwOTY0NTQxN30.D9moPezYEF00kQti2zNal11cJf11twDJfzu1jAkkvwM';

var supabaseClient;
var currentUser = null, rooms = [], history = [], noteFilter = 'all', authMode = 'login';

function emailFromLogin(login) { return login.toLowerCase().replace(/[^a-z0-9]/g, '') + '@alcohol.local'; }
function authErr(msg) { document.getElementById('aErr').textContent = msg; }

window.onload = async () => {
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("Сервер не отвечает (таймаут).")), 5000));
    const sessionReq = supabaseClient.auth.getSession();
    const { data, error } = await Promise.race([sessionReq, timeout]);
    if (error) throw error;
    if (data.session) { await loadProfile(data.session.user.id); }
    else { renderAuth(); }
  } catch (err) {
    document.getElementById('authForm').innerHTML = `<div style="color:#ef4444; padding:15px; border:1px solid #ef4444; border-radius:10px; text-align:center; font-size:14px; background: rgba(239,68,68, 0.1);"><b>Ошибка:</b><br>${err.message}</div>`;
  }
};

function renderAuth() {
  const box = document.getElementById('authForm');
  if (authMode === 'login') {
    box.innerHTML = `<div class="card"><label class="field-label">Логин</label><input class="input" id="aLogin"><label class="field-label">Пароль</label><input class="input" id="aPass" type="password"><div id="aErr" class="err"></div><button class="btn-primary btn-full mt-10" onclick="doLogin()">Войти</button><div class="hint">Нет аккаунта? <a href="#" onclick="setAuthMode('register');return false;">Зарегистрироваться</a></div></div>`;
  } else {
    box.innerHTML = `<div class="card"><label class="field-label">Логин (2–5 символов)</label><input class="input" id="aLogin" maxlength="5"><label class="field-label">Ваше имя</label><input class="input" id="aName" maxlength="20"><label class="field-label">Пароль (от 6 символов)</label><input class="input" id="aPass" type="password"><label class="field-label">Повторите пароль</label><input class="input" id="aPass2" type="password"><div id="aErr" class="err"></div><button class="btn-primary btn-full mt-10" onclick="doRegister()">Создать</button><div class="hint">Уже есть? <a href="#" onclick="setAuthMode('login');return false;">Войти</a></div></div>`;
  }
}
function setAuthMode(m) { authMode = m; renderAuth(); }

async function doLogin() {
  const login = document.getElementById('aLogin').value.trim(), pass = document.getElementById('aPass').value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email: emailFromLogin(login), password: pass });
  if (error) { authErr("Неверный логин/пароль или ошибка базы"); return; }
  await loadProfile(data.user.id);
}

async function doRegister() {
  const login = document.getElementById('aLogin').value.trim(), name = document.getElementById('aName').value.trim();
  const pass = document.getElementById('aPass').value, pass2 = document.getElementById('aPass2').value;
  if (login.length < 2 || login.length > 5) { authErr("Логин 2-5 символов"); return; }
  if (name.length < 2) { authErr("Укажите имя"); return; }
  if (pass.length < 6) { authErr("Пароль от 6 символов"); return; }
  if (pass !== pass2) { authErr("Пароли не совпадают"); return; }
  
  const { error } = await supabaseClient.auth.signUp({ email: emailFromLogin(login), password: pass, options: { data: { login, name } } });
  if (error) { authErr(error.message); return; }
  alert("Аккаунт создан! Войдите."); setAuthMode('login');
}

async function loadProfile(userId) {
  const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', userId).single();
  if (error || !data) { alert("Профиль не найден"); await supabaseClient.auth.signOut(); return; }
  currentUser = data; startApp();
}

async function logout() {
  await supabaseClient.auth.signOut(); currentUser = null; rooms = []; history = [];
  document.getElementById('app').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
  setAuthMode('login');
}

async function startApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('roleBadge').textContent = currentUser.role === 'admin' ? 'Админ' : currentUser.login;
  document.getElementById('roleBadge').className = 'badge' + (currentUser.role === 'admin' ? ' admin' : '');
  await refreshData();
}

async function refreshData() {
  const { data: r } = await supabaseClient.from('rooms').select('*').order('number');
  const { data: h } = await supabaseClient.from('history').select('*').order('created_at', { ascending: false }).limit(100);
  rooms = r || []; history = h || []; renderAll();
}

function renderAll() { renderRooms(); renderNotes(); renderAdmin(); }

function renderRooms() {
  const q = (document.getElementById('searchRooms').value || '').toLowerCase().trim();
  const list = document.getElementById('roomsList');
  const filtered = rooms.filter(r => r.number.toLowerCase().includes(q) || (r.guest || '').toLowerCase().includes(q));
  if (!filtered.length) { list.innerHTML = '<div style="text-align:center;color:#555;padding:20px;">Номеров не найдено</div>'; return; }
  const blocks = [ { name: '3 этаж', prefix: '3' }, { name: '2 этаж', prefix: '2' }, { name: 'Цоколь', prefix: '1' } ];
  let html = '';
  blocks.forEach(block => {
    const blockRooms = filtered.filter(r => r.number.startsWith(block.prefix));
    if (!blockRooms.length) return;
    html += `<h2 class="block-title">${block.name}</h2>`;
    html += blockRooms.map(r => {
      const total = (r.items || []).reduce((s, i) => s + i.qty, 0);
      const cls = total === 0 ? 'zero' : '';
      const itemsHtml = (r.items || []).length ? r.items.map((it, idx) => `<div class="item-row"><span>${it.name}</span><div class="item-controls"><span class="qty-pill">${it.qty}</span><button class="btn-minus" onclick="drink(${r.id}, ${idx})">−</button></div></div>`).join('') : '<div style="padding:4px 0;font-size:12px;color:#777;">Пусто</div>';
      return `<div class="room-card"><div class="room-head"><span class="room-title">🚪 ${r.number}${r.guest ? ' · ' + r.guest : ''}</span><span class="stock-badge ${cls}">${total} шт.</span></div>${itemsHtml}<div class="actions"><button class="btn-primary" onclick="openAdd(${r.id})">➕ Загрузить</button></div></div>`;
    }).join('');
  });
  list.innerHTML = html;
}

function setFilter(f, el) { noteFilter = f; document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active')); el.classList.add('active'); renderNotes(); }

function renderNotes() {
  const list = document.getElementById('notesList');
  let items = history;
  if (noteFilter !== 'all') items = items.filter(n => n.type === noteFilter);
  if (!items.length) { list.innerHTML = '<div style="text-align:center;color:#555;padding:20px;">Записей нет</div>'; return; }
  list.innerHTML = items.map(n => {
    const isArrival = n.type === 'arrival';
    const who = `${n.by_login} (${n.by_name})`;
    const verb = isArrival ? 'добавил в' : 'списал из';
    const time = new Date(n.created_at).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    return `<div class="note ${isArrival ? 'arrival' : ''}"><div>${isArrival ? '📥' : '📤'} <b>${who}</b> ${verb} <b>#${n.room}</b></div><div>«${n.item}» — ${n.qty} шт.</div><div class="time">${time}</div></div>`;
  }).join('');
}

function renderAdmin() {
  const panel = document.getElementById('adminPanel');
  if (currentUser.role !== 'admin') { panel.innerHTML = '<div style="text-align:center;color:#555;padding:20px;">Только для админа (#1)</div>'; return; }
  const byUser = {};
  history.forEach(n => { const key = `${n.by_login} (${n.by_name})`; if (!byUser[key]) byUser[key] = { arrivals: 0, writeoffs: 0 }; if (n.type === 'arrival') byUser[key].arrivals += n.qty; else byUser[key].writeoffs += n.qty; });
  const activity = Object.entries(byUser).map(([who, s]) => `<div class="item-row"><span>${who}</span><span style="font-size:12px;color:#888;">📥 ${s.arrivals} · 📤 ${s.writeoffs}</span></div>`).join('') || '<div style="font-size:12px;color:#777;">Нет операций</div>';
  panel.innerHTML = `<div class="card"><b>Кто что делал</b>${activity}</div><div class="card"><b>Номера (${rooms.length})</b><button class="btn-primary btn-full mt-10" onclick="openAddRoom()">➕ Добавить</button><div style="margin-top:10px;">${rooms.map(r => `<div class="item-row"><span>🚪 ${r.number}</span><button class="btn-danger" style="flex:none;padding:6px 12px;font-size:12px;" onclick="delRoom(${r.id})">Удалить</button></div>`).join('')}</div></div>`;
}

function switchTab(name, el) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById('view-' + name).classList.add('active'); document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); }
function openModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modalBg').classList.add('show'); }
function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });

function openAdd(roomId) { openModal(`<h3>Загрузить</h3><label class="field-label">Напиток</label><input class="input" id="mItem"><label class="field-label">Кол-во</label><input class="input" id="mQty" type="number" value="1" min="1"><div class="modal-btns"><button class="btn-ghost" onclick="closeModal()">Отмена</button><button class="btn-primary" onclick="addItem(${roomId})">ОК</button></div>`); }

async function addItem(roomId) {
  const name = document.getElementById('mItem').value.trim(), qty = parseInt(document.getElementById('mQty').value) || 0;
  if (!name || qty <= 0) return alert('Заполните поля');
  const room = rooms.find(r => r.id === roomId), items = [...(room.items || [])], ex = items.find(i => i.name.toLowerCase() === name.toLowerCase());
  if (ex) ex.qty += qty; else items.push({ name, qty });
  await supabaseClient.from('rooms').update({ items }).eq('id', roomId);
  await supabaseClient.from('history').insert({ type: 'arrival', room: room.number, item: name, qty, by_login: currentUser.login, by_name: currentUser.name });
  closeModal(); await refreshData();
}

async function drink(roomId, itemIdx) {
  const room = rooms.find(r => r.id === roomId), items = [...(room.items || [])], item = items[itemIdx];
  if (!item || item.qty <= 0) return;
  if (!confirm(`Списать «${item.name}»?`)) return;
  item.qty -= 1; const newItems = item.qty === 0 ? items.filter((_, i) => i !== itemIdx) : items;
  await supabaseClient.from('rooms').update({ items: newItems }).eq('id', roomId);
  await supabaseClient.from('history').insert({ type: 'writeoff', room: room.number, item: item.name, qty: 1, by_login: currentUser.login, by_name: currentUser.name });
  await refreshData();
}

function openAddRoom() { openModal(`<h3>Новый номер</h3><label class="field-label">Номер</label><input class="input" id="mNum"><label class="field-label">Гость</label><input class="input" id="mGuest"><div class="modal-btns"><button class="btn-ghost" onclick="closeModal()">Отмена</button><button class="btn-primary" onclick="addRoom()">ОК</button></div>`); }
async function addRoom() {
  const num = document.getElementById('mNum').value.trim(), guest = document.getElementById('mGuest').value.trim();
  if (!num) return alert('Введите номер');
  await supabaseClient.from('rooms').insert({ number: num, guest, items: [] }); closeModal(); await refreshData();
}
async function delRoom(id) { if (!confirm('Удалить?')) return; await supabaseClient.from('rooms').delete().eq('id', id); await refreshData(); }
</script>
</body>
</html>
