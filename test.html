<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Тест 2</title></head>
<body style="background:#111; color:#fff; font-family:sans-serif; padding:20px;">
  <h2>Проверка связи</h2>
  <div id="result" style="font-size:16px; padding:10px; border:1px solid #444;">Загрузка...</div>

  <script>
    // Мы просто стучимся в Supabase и просим сказать "Привет"
    fetch('https://slffatuydefaeyubzbdy.supabase.co/auth/v1/health')
      .then(response => {
        const res = document.getElementById('result');
        if (response.ok) {
          res.style.background = '#080';
          res.innerHTML = 'УСПЕХ! База жива и отвечает. Проблема в ключе.';
        } else {
          res.style.background = '#f00';
          res.innerHTML = 'База отвечает, но с ошибкой: ' + response.status;
        }
      })
      .catch(err => {
        document.getElementById('result').innerHTML = 'ОШИБКА СЕТИ: ' + err.message;
      });
  </script>
</body>
</html>
